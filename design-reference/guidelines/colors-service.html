<!doctype html><html dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:52px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:500 11px/1.3 var(--font-mono);color:var(--text-secondary);margin-top:6px}.sw s{display:block;text-decoration:none;font:400 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--svc-1)"></i><b>1</b><s>--svc-1</s></div><div class="sw"><i style="background:var(--svc-2)"></i><b>2</b><s>--svc-2</s></div><div class="sw"><i style="background:var(--svc-3)"></i><b>3</b><s>--svc-3</s></div><div class="sw"><i style="background:var(--svc-4)"></i><b>4</b><s>--svc-4</s></div><div class="sw"><i style="background:var(--svc-5)"></i><b>5</b><s>--svc-5</s></div><div class="sw"><i style="background:var(--svc-6)"></i><b>6</b><s>--svc-6</s></div><div class="sw"><i style="background:var(--svc-7)"></i><b>7</b><s>--svc-7</s></div><div class="sw"><i style="background:var(--svc-8)"></i><b>8</b><s>--svc-8</s></div></div></body></html>
