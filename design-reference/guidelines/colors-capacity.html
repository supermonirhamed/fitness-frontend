<!doctype html><html dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:52px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:500 11px/1.3 var(--font-mono);color:var(--text-secondary);margin-top:6px}.sw s{display:block;text-decoration:none;font:400 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="gap:24px"><div style="flex:1"><div style="height:6px;border-radius:99px;background:var(--cap-track)"><div style="height:6px;width:60%;border-radius:99px;background:var(--cap-available)"></div></div><b style="display:block;font:500 11px var(--font-mono);color:var(--text-secondary);margin-top:8px">--cap-available</b></div><div style="flex:1"><div style="height:6px;border-radius:99px;background:var(--cap-track)"><div style="height:6px;width:86%;border-radius:99px;background:var(--cap-almost)"></div></div><b style="display:block;font:500 11px var(--font-mono);color:var(--text-secondary);margin-top:8px">--cap-almost</b></div><div style="flex:1"><div style="height:6px;border-radius:99px;background:var(--cap-track)"><div style="height:6px;width:100%;border-radius:99px;background:var(--cap-full)"></div></div><b style="display:block;font:500 11px var(--font-mono);color:var(--text-secondary);margin-top:8px">--cap-full</b></div><div style="flex:1"><div style="height:6px;border-radius:99px;background:var(--cap-track)"><div style="height:6px;width:100%;border-radius:99px;background:var(--cap-cancelled)"></div></div><b style="display:block;font:500 11px var(--font-mono);color:var(--text-secondary);margin-top:8px">--cap-cancelled</b></div></div></body></html>
