<!doctype html><html dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:52px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:500 11px/1.3 var(--font-mono);color:var(--text-secondary);margin-top:6px}.sw s{display:block;text-decoration:none;font:400 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="gap:8px"><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-secondary-bg);color:var(--sev-secondary-fg)">Draft</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-success-bg);color:var(--sev-success-fg)">Published</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-success-bg);color:var(--sev-success-fg)">Active</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-danger-bg);color:var(--sev-danger-fg)">Full</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-warn-bg);color:var(--sev-warn-fg)">Waitlist</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-contrast-bg);color:var(--sev-contrast-fg)">Cancelled</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-info-bg);color:var(--sev-info-fg)">Completed</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-secondary-bg);color:var(--sev-secondary-fg)">Expired</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-warn-bg);color:var(--sev-warn-fg)">Late cancel</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-danger-bg);color:var(--sev-danger-fg)">No-show</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-success-bg);color:var(--sev-success-fg)">Checked-in</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-secondary-bg);color:var(--sev-secondary-fg)">Inactive</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font:600 12px/1 var(--font-sans);background:var(--sev-danger-bg);color:var(--sev-danger-fg)">Blocked</span></div><div style="margin-top:12px;font:var(--text-small);color:var(--text-muted)">Tag severity: secondary · success · danger · warn · contrast · info</div></body></html>
