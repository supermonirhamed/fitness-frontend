<!doctype html><html dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:52px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:500 11px/1.3 var(--font-mono);color:var(--text-secondary);margin-top:6px}.sw s{display:block;text-decoration:none;font:400 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--surface-0)"></i><b>0</b><s>--surface-0</s></div><div class="sw"><i style="background:var(--surface-50)"></i><b>50</b><s>--surface-50</s></div><div class="sw"><i style="background:var(--surface-100)"></i><b>100</b><s>--surface-100</s></div><div class="sw"><i style="background:var(--surface-200)"></i><b>200</b><s>--surface-200</s></div><div class="sw"><i style="background:var(--surface-300)"></i><b>300</b><s>--surface-300</s></div><div class="sw"><i style="background:var(--surface-400)"></i><b>400</b><s>--surface-400</s></div><div class="sw"><i style="background:var(--surface-500)"></i><b>500</b><s>--surface-500</s></div><div class="sw"><i style="background:var(--surface-600)"></i><b>600</b><s>--surface-600</s></div><div class="sw"><i style="background:var(--surface-700)"></i><b>700</b><s>--surface-700</s></div><div class="sw"><i style="background:var(--surface-800)"></i><b>800</b><s>--surface-800</s></div><div class="sw"><i style="background:var(--surface-900)"></i><b>900</b><s>--surface-900</s></div><div class="sw"><i style="background:var(--surface-950)"></i><b>950</b><s>--surface-950</s></div></div></body></html>
