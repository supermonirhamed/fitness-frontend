<!doctype html><html dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:52px}.sw i{display:block;height:48px;border-radius:6px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:500 11px/1.3 var(--font-mono);color:var(--text-secondary);margin-top:6px}.sw s{display:block;text-decoration:none;font:400 10px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="min-width:90px"><i style="background:var(--bg-app)"></i><s>--bg-app</s></div><div class="sw" style="min-width:90px"><i style="background:var(--surface-card)"></i><s>--surface-card</s></div><div class="sw" style="min-width:90px"><i style="background:var(--surface-sunken)"></i><s>--surface-sunken</s></div><div class="sw" style="min-width:90px"><i style="background:var(--surface-hover)"></i><s>--surface-hover</s></div><div class="sw" style="min-width:90px"><i style="background:var(--surface-selected)"></i><s>--surface-selected</s></div><div class="sw" style="min-width:90px"><i style="background:var(--border-default)"></i><s>--border-default</s></div><div class="sw" style="min-width:90px"><i style="background:var(--border-strong)"></i><s>--border-strong</s></div><div class="sw" style="min-width:90px"><i style="background:var(--text-primary)"></i><s>--text-primary</s></div><div class="sw" style="min-width:90px"><i style="background:var(--text-secondary)"></i><s>--text-secondary</s></div><div class="sw" style="min-width:90px"><i style="background:var(--text-muted)"></i><s>--text-muted</s></div><div class="sw" style="min-width:90px"><i style="background:var(--primary)"></i><s>--primary</s></div><div class="sw" style="min-width:90px"><i style="background:var(--primary-subtle)"></i><s>--primary-subtle</s></div></div></body></html>
